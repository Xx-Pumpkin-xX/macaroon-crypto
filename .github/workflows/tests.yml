# Runs the whole test suite on every push and pull request.
# Python 3.10 matches Part 2's Windows retest; 3.13 matches the benchmarks.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r tests/requirements.txt
          python -m pip install ./backend/pymacaroons

      - name: Run tests
        run: python -m pytest -q
